name: CLIPFORGE – VOD-Clips (bereits gestreamte Streams)

on:
  workflow_dispatch:
    inputs:
      streamers:
        description: "Kommagetrennte Streamer; leer = alle APPROVED_CHANNELS"
        required: false
        default: ""
        type: string
      hours:
        description: "VOD-Zeitraum: letzte X Stunden (1–168)"
        required: true
        default: "72"
        type: string
      max_clips:
        description: "Maximal fertige Clips insgesamt (1–12)"
        required: true
        default: "7"
        type: string
      redo_files:
        description: "Vorhandene Clips neu schneiden (Dateinamen, kommagetrennt)"
        required: false
        default: ""
        type: string
      vod_url:
        description: "Direkter Link zur Aufzeichnung (z. B. YouTube); leer = Twitch-VODs der Streamer"
        required: false
        default: ""
        type: string
      campaign:
        description: "Kampagne (config/campaigns/<name>.json), z. B. dylanpage, clipup; leer = keine"
        required: false
        default: ""
        type: string
      title_filter:
        description: "Optionaler Text im VOD-Titel (z. B. GTA); leer = alle"
        required: false
        default: "GTA"
        type: string

permissions:
  contents: write

concurrency:
  group: clipforge-vod-${{ inputs.redo_files != '' && 'redo' || inputs.campaign || 'plain' }}
  cancel-in-progress: false

jobs:
  vod-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # STRICT allowlist. Never replace this with user-supplied channels.
      # CAMPAIGN_CHANNELS: Streamer offizieller Clipping-Kampagnen, denen der Nutzer beigetreten ist (z. B. lacy / Reach Clipping).
      APPROVED_CHANNELS: ${{ vars.CAMPAIGN_CHANNELS || 'lacy' }},${{ vars.APPROVED_CHANNELS }}
      VOD_STREAMERS: ${{ inputs.streamers || (github.event_name == 'push' && (vars.CAMPAIGN_CHANNELS || 'lacy')) || '' }}
      VOD_HOURS: ${{ inputs.hours || '96' }}
      MAX_CLIPS: ${{ inputs.max_clips || '7' }}
      TITLE_FILTER: ${{ inputs.title_filter || 'GTA' }}
      VODS_PER_STREAMER: "1"
      SCAN_WINDOWS: "2"
      SCAN_SECONDS: "240"
      MIN_GAP: "120"
      CAPTION_STYLE: glow
      CAMPAIGN: ${{ inputs.campaign || '' }}
      VOD_URL: ${{ inputs.vod_url || '' }}
      REDO_FILES: ${{ inputs.redo_files || '' }}
      PER_VOD: ${{ inputs.max_clips || '7' }}
      VOD_SKIP_START: "900"
      DEBUG_FRAMES: "1"
      SPIKE_DB: "6"
      VIDEO_WIDTH: "1080"
      VIDEO_FIT: split
      WHISPER_MODEL: small
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: clips
      REQUIRE_FACECAM: "1"
      KEEP_BEST: ${{ vars.KEEP_BEST || '3' }}   # App zeigt nur die besten 3 (letzte 24 h), Rest wird gelöscht
      KEEP_HOURS: "24"
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
      CLIPFORGE_OUTPUT: output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Syntax
        run: python -m compileall -q scripts/monitor.py scripts/captions.py scripts/live_capture.py scripts/vod_clips.py tests/test_vod_clips.py
      - name: VOD-Komponententests
        run: CAMPAIGN= REQUIRE_FACECAM= python -m unittest discover -s tests -p 'test_vod_clips.py' -v
      - name: Voraussetzungen und Abgrenzung pruefen
        run: |
          test -n "$APPROVED_CHANNELS" || test -n "$CAMPAIGN" || { echo "::error::GitHub-Variable APPROVED_CHANNELS fehlt. Nur freigegebene Twitch-Kanaele duerfen verarbeitet werden."; exit 1; }
          test -n "$TWITCH_CLIENT_ID" && test -n "$TWITCH_CLIENT_SECRET" || { echo "::error::Twitch-Helix-Secrets TWITCH_CLIENT_ID und TWITCH_CLIENT_SECRET fehlen."; exit 1; }
          echo "Nur oeffentliche VODs; keine Umgehung von Login, Abo oder geloeschten Videos."
      - name: FFmpeg, yt-dlp und faster-whisper installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check --quiet "yt-dlp>=2026.10.0" "streamlink>=8,<9" "faster-whisper>=1.1,<2" Pillow "nudenet>=3.4,<4" "opencv-python-headless<5"
      - name: Release clips pruefen oder erstellen
        run: |
          gh release view clips >/dev/null 2>&1 || gh release create clips --title "CLIPFORGE Clips" --notes "Verifizierte Clip-Exporte" --latest=false
      - name: VODs pruefen, Highlights finden und MP4s verifizieren
        run: python -u scripts/vod_clips.py
      - name: Handy-App aktualisieren (docs/clips.json)
        if: ${{ !cancelled() }}
        run: |
          python scripts/update_index.py
          git config user.name "clipforge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/clips.json "$RUNNER_TEMP/mine.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python scripts/update_index.py --merge "$RUNNER_TEMP/mine.json"
            git add docs/clips.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Clip-Übersicht aktualisiert [skip ci]"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i*7))
          done
          exit 1
      - name: Vollbilder (Facecam-Position) hochladen
        if: always()
        run: |
          ls output/frames/*.jpg >/dev/null 2>&1 || exit 0
          gh release view debug >/dev/null 2>&1 || gh release create debug --title debug --notes "Standbilder" --latest=false
          gh release upload debug output/frames/*.jpg --clobber
      - name: ffprobe-Nachweis und Bericht
        if: always()
        run: |
          if [ -f output/vod_report.json ]; then
            python - <<'PY'
          import json
          d=json.load(open("output/vod_report.json"))
          print("VODs gefunden:",d.get("vods_found",0))
          print("Kandidaten:",d.get("candidate_count",0))
          for c in d.get("clips",[]):
              print("MP4",c["file"],"ffprobe",json.dumps(c.get("ffprobe",{})),"uploaded",c.get("published",False))
          for s in d.get("skip_reasons",[])[:12]:
              print("UEBERSPRUNGEN",json.dumps(s,ensure_ascii=False))
          print("Fehler:",d.get("fatal_error"))
          PY
          else
            echo "::error::Kein VOD-Bericht entstanden (Abbruch vor Skriptstart)."
          fi
          for f in output/*.mp4; do
            [ -f "$f" ] || continue
            printf "VERIFIED_FILE %s " "$(basename "$f")"
            ffprobe -v error -show_entries stream=codec_name,width,height,avg_frame_rate:format=duration -of compact "$f"
          done
      - name: Diagnostik archivieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-vod-report-${{ github.run_id }}
          path: |
            output/vod_report.json
            output/clips.json
          if-no-files-found: warn
          retention-days: 7
