name: CLIPFORGE – Nacktheits-Filter prüfen (alle Release-Clips)
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/safety.py", ".github/workflows/nsfw-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && python -m pip install --quiet "nudenet>=3.4,<4"
      - name: Clips laden
        run: mkdir -p clips && gh release download clips -R "$GITHUB_REPOSITORY" -p "*.mp4" -D clips
      - name: Jeden Clip prüfen (wie vor dem Posten)
        run: |
          python - <<'PY'
          import sys; from pathlib import Path
          sys.path.insert(0, "scripts"); import safety
          for f in sorted(Path("clips").glob("*.mp4")):
              ok, why = safety.check(f)
              print(("OK       " if ok else "BLOCKIERT"), f.name, "-", why, flush=True)
          PY
