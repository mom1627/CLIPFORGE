name: Kai VOD - five chat candidates
on:
  push:
    branches: [test/public-vod-import]
    paths: [.github/workflows/kai-five-candidates.yml]
permissions:
  contents: read
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: peak_26m20, range: '*00:25:40-00:27:00'}
          - {name: peak_29m10, range: '*00:28:30-00:29:50'}
          - {name: peak_40m40, range: '*00:40:00-00:41:20'}
          - {name: peak_54m40, range: '*00:54:00-00:55:20'}
          - {name: peak_57m40, range: '*00:57:00-00:58:20'}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m pip install --disable-pip-version-check -q yt-dlp
      - name: Download public VOD excerpt
        env:
          SECTION: ${{ matrix.range }}
        run: |
          python -m yt_dlp --no-playlist -f 'best[height<=720]/best' --download-sections "$SECTION" --force-keyframes-at-cuts -o sample.mp4 'https://www.twitch.tv/videos/2932305259'
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 sample.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: sample.mp4
          retention-days: 1
