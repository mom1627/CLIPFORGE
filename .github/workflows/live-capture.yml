name: CLIPFORGE – Video-Pipeline Test
on:
  workflow_dispatch:
    inputs:
      streamer:
        description: "Streamer aus der freigegebenen Liste (leer = ersten Live-Streamer wählen)"
        required: false
        type: string
      capture_seconds:
        description: "Aufnahmelänge (45–130 Sekunden)"
        required: false
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: clipforge-live-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      APPROVED_CHANNELS: ${{ vars.APPROVED_CHANNELS || 'kaicenat,xqc,montanablack88,trymacs,papaplatte,caseoh_' }}
      TARGET_STREAMER: ${{ inputs.streamer || '' }}
      CAPTURE_SECONDS: ${{ inputs.capture_seconds || '100' }}
      CLIP_SECONDS: "38"
      VIDEO_WIDTH: "720"
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_UPLOAD_MODE: "draft"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Streamlink installieren
        run: |
          python -m pip install --disable-pip-version-check --quiet "streamlink>=8,<9"
          ffmpeg -version | head -n 1
      - name: Lokale Tests
        run: python -m unittest discover -s tests -p 'test_capture.py' -v
      - name: Live-Aufnahme, Highlight und MP4
        run: python scripts/live_capture.py
      - name: Video und Statusbericht auf GitHub bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-live-${{ github.run_id }}
          path: output/*
          if-no-files-found: warn
          retention-days: 5
