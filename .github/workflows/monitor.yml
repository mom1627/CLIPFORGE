name: CLIPFORGE – Live-Monitor (Clips während des Streams)
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Überwachungsdauer in Minuten (max. 340)"
        default: "330"
      channels:
        description: "Streamer (kommagetrennt), leer = Standardliste"
        default: ""
      max_clips:
        description: "Maximale Anzahl Clips"
        default: "12"
      spike_db:
        description: "Lautstärke-Anstieg in dB für ein Highlight (kleiner = mehr Clips)"
        default: "7"
  schedule:
    - cron: "10 */6 * * *"   # nur bei öffentlichem Repo (unbegrenzte Minuten), siehe if unten

permissions:
  contents: write

concurrency:
  group: clipforge-${{ github.event_name == 'schedule' && 'sched' || github.run_id }}
  cancel-in-progress: false

jobs:
  monitor:
    # Geplante Läufe nur, wenn das Repo öffentlich ist; sonst würde das private Minuten-Kontingent (2000/Monat) aufgebraucht.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false || vars.CLOUD_ALWAYS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      APPROVED_CHANNELS: ${{ inputs.channels || vars.APPROVED_CHANNELS || 'kaicenat,xqc,jynxzi,caseoh_,ohnepixel,hasanabi,montanablack88,trymacs,papaplatte,eliasn97,knossi,revedtv' }}
      ALLOWED_GAMES: ${{ vars.ALLOWED_GAMES || '*' }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      MONITOR_MINUTES: ${{ inputs.minutes || '330' }}
      SPIKE_DB: ${{ inputs.spike_db || '7' }}
      VIDEO_WIDTH: "720"
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: clips
      MAX_CLIPS: ${{ inputs.max_clips || '12' }}
      CAPTIONS: "1"
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || '0' }}
      MAX_POSTS: ${{ vars.MAX_POSTS || '5' }}
      POST_BEST: ${{ vars.POST_BEST || '5' }}
      POST_GAP_MINUTES: ${{ vars.POST_GAP_MINUTES || '60' }}
      POST_SLOTS: ${{ vars.POST_SLOTS || '10,12,16,18,20' }}
      POST_TZ: Europe/Berlin
      CAPTION_TAGS: ${{ vars.CAPTION_TAGS }}
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
      HOOKS: ${{ vars.HOOKS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg und Streamlink installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check --quiet "streamlink>=8,<9" faster-whisper "nudenet>=3.4,<4" Pillow
      - name: Whisper-Modell vorab laden
        run: python -c "from faster_whisper import WhisperModel; WhisperModel('${{ vars.WHISPER_MODEL || 'small' }}', device='cpu', compute_type='int8')"
      - name: Tests
        run: python -m unittest discover -s tests -p 'test_monitor.py' -v
      - name: Release "clips" anlegen (falls fehlend)
        run: gh release view clips >/dev/null 2>&1 || gh release create clips --title "CLIPFORGE Clips" --notes "Automatisch erzeugte 9:16-MP4-Clips" --latest=false
      - name: Live überwachen und clippen
        run: timeout $(( ${MONITOR_MINUTES%.*} + 10 ))m python -u scripts/monitor.py
      - name: Beste Clips posten (Top 5 am Ende des Laufs)
        if: always()
        run: python -u scripts/post_best.py
      - name: MP4-Prüfung
        if: always()
        run: |
          cat output/monitor_report.json 2>/dev/null || true
          for f in output/*.mp4; do [ -f "$f" ] && ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration,size -of compact "$f"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipforge-monitor-${{ github.run_id }}
          path: output/*
          if-no-files-found: warn
          retention-days: 5
