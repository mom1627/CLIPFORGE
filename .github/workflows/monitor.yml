name: CLIPFORGE – Live-Monitor (Clips während des Streams)
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Überwachungsdauer in Minuten (max. 340)"
        default: "330"
      channels:
        description: "Streamer (kommagetrennt), leer = Standardliste"
        default: ""
      max_clips:
        description: "Maximale Anzahl Clips"
        default: "12"
      campaign:
        description: "Kampagne (z. B. clipup = Logo + #Clipup; dylanpage); leer = keine"
        default: ""
      post:
        description: "Automatisch über Buffer posten (1 = ja, 0 = nein)"
        default: "1"
      spike_db:
        description: "Lautstärke-Anstieg in dB für ein Highlight (kleiner = mehr Clips)"
        default: "5.5"
      chain:
        description: "24/7: am Ende automatisch den nächsten Lauf starten (1 = ja, 0 = nein)"
        default: "1"
  schedule:
    - cron: "10 */6 * * *"   # nur bei öffentlichem Repo (unbegrenzte Minuten), siehe if unten

permissions:
  contents: write
  actions: write

# Immer nur EIN Live-Monitor gleichzeitig (24/7-Kette + Zeitplan als Reserve)
concurrency:
  group: clipforge-live
  cancel-in-progress: false

jobs:
  monitor:
    # Geplante Läufe nur, wenn das Repo öffentlich ist; sonst würde das private Minuten-Kontingent (2000/Monat) aufgebraucht.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false || vars.CLOUD_ALWAYS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      APPROVED_CHANNELS: ${{ inputs.channels || format('{0},{1}', vars.CAMPAIGN_CHANNELS || 'lacy', vars.APPROVED_CHANNELS || 'kaicenat,xqc,jynxzi,caseoh_,ohnepixel,hasanabi,montanablack88,trymacs,papaplatte,eliasn97,knossi,revedtv') }}
      ALLOWED_GAMES: ${{ vars.ALLOWED_GAMES || '*' }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      MONITOR_MINUTES: ${{ inputs.minutes || '330' }}
      SPIKE_DB: ${{ inputs.spike_db || '5.5' }}
      VIDEO_WIDTH: "1080"
      CAPTION_STYLE: glow
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: clips
      REQUIRE_FACECAM: "1"
      KEEP_BEST: ${{ vars.KEEP_BEST || '10' }}   # App zeigt die besten 10 (letzte 48 h), Rest wird gelöscht
      KEEP_HOURS: "48"
      MIN_FUN: ${{ vars.MIN_FUN || '3' }}   # nur Clips mit deutlicher Reaktion des Streamers
      STRICT_GAME: ${{ vars.STRICT_GAME || 'Grand Theft Auto VI' }}   # nur GTA VI – kein Just Chatting/IRL
      MAX_CLIPS: ${{ inputs.max_clips || '12' }}
      CAPTIONS: "1"
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
      AUTO_PUBLISH: ${{ inputs.post || vars.AUTO_PUBLISH || secrets.AUTO_PUBLISH || '0' }}
      MAX_POSTS: ${{ vars.MAX_POSTS || '5' }}
      POST_BEST: ${{ vars.POST_BEST || '5' }}
      POST_GAP_MINUTES: ${{ vars.POST_GAP_MINUTES || '120' }}
      POST_SLOTS: ${{ vars.POST_SLOTS || '10,12,16,18,20' }}
      POST_TZ: Europe/Berlin
      CAMPAIGN: ${{ inputs.campaign || vars.CAMPAIGN || 'auto' }}  # auto: Lacy -> lacy, GTA VI -> clipup, sonst keine
      POST_MODE: ${{ vars.POST_MODE || 'now' }}
      CAPTION_TAGS: ${{ vars.CAPTION_TAGS }}
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
      HOOKS: ${{ vars.HOOKS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg und Streamlink installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check --quiet "streamlink>=8,<9" faster-whisper "nudenet>=3.4,<4" "opencv-python-headless<5" Pillow
      - name: Whisper-Modell vorab laden
        run: python -c "from faster_whisper import WhisperModel; WhisperModel('${{ vars.WHISPER_MODEL || 'small' }}', device='cpu', compute_type='int8')"
      - name: Startzeit merken
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Tests
        id: tests
        run: CAMPAIGN= REQUIRE_FACECAM= python -m unittest discover -s tests -p 'test_monitor.py' -v
      - name: Release "clips" anlegen (falls fehlend)
        run: gh release view clips >/dev/null 2>&1 || gh release create clips --title "CLIPFORGE Clips" --notes "Automatisch erzeugte 9:16-MP4-Clips" --latest=false
      - name: Live überwachen und clippen
        run: timeout $(( ${MONITOR_MINUTES%.*} + 10 ))m python -u scripts/monitor.py
      - name: Beste Clips posten (Rest am Ende des Laufs)
        if: ${{ !cancelled() }}
        run: python -u scripts/post_best.py
      - name: Handy-App aktualisieren (docs/clips.json)
        if: ${{ !cancelled() }}
        run: |
          python scripts/update_index.py
          git config user.name "clipforge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/clips.json "$RUNNER_TEMP/mine.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python scripts/update_index.py --merge "$RUNNER_TEMP/mine.json"
            git add docs/clips.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Clip-Übersicht aktualisiert [skip ci]"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i*7))
          done
          exit 1
      - name: 24/7 – nächsten Lauf starten
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && (github.event_name == 'schedule' || inputs.chain != '0') }}
        env:
          NEXT_POST: ${{ vars.AUTO_PUBLISH || '0' }}
          NEXT_CAMPAIGN: ${{ inputs.campaign }}
        run: |
          # Schutz vor Endlosschleife: nur weitermachen, wenn dieser Lauf wirklich überwacht hat (>= 30 min)
          [ $(( $(date +%s) - RUN_START )) -ge 1800 ] || { echo "::warning::Lauf war zu kurz – 24/7-Kette gestoppt (Fehler prüfen)."; exit 0; }
          gh workflow run monitor.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f post="$NEXT_POST" -f chain=1 -f campaign="$NEXT_CAMPAIGN"
      - name: MP4-Prüfung
        if: always()
        run: |
          cat output/monitor_report.json 2>/dev/null || true
          for f in output/*.mp4; do [ -f "$f" ] && ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration,size -of compact "$f"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipforge-monitor-${{ github.run_id }}
          path: output/*
          if-no-files-found: warn
          retention-days: 5
