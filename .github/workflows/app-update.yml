name: CLIPFORGE – Handy-App aktualisieren (Vorschauen nachholen)
on:
  workflow_dispatch:
    inputs:
      delete_files:
        description: "Bestimmte Clips löschen (Dateinamen, kommagetrennt)"
        required: false
        default: ""
        type: string
      delete_before:
        description: "Clips löschen, die vor diesem Datum erstellt wurden (JJJJ-MM-TT); leer = nichts löschen"
        required: false
        default: ""
        type: string
permissions:
  contents: write
concurrency:
  group: clipforge-app-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: clips
      PREVIEW_MAX: "40"
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Alte Clips löschen
        if: ${{ inputs.delete_before != '' }}
        env:
          BEFORE: ${{ inputs.delete_before }}
        run: |
          echo "$BEFORE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "Datum ungültig"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/clips" --jq ".assets[] | select(.name|endswith(\".mp4\")) | select(.created_at < \"${BEFORE}\") | .name" > old.txt
          echo "Lösche $(wc -l < old.txt) Clips:"; cat old.txt
          while read -r n; do gh release delete-asset clips "$n" -R "$GITHUB_REPOSITORY" -y; done < old.txt
      - name: Bestimmte Clips löschen
        if: ${{ inputs.delete_files != '' }}
        env:
          FILES: ${{ inputs.delete_files }}
        run: |
          for n in $(echo "$FILES" | tr ',' ' '); do
            echo "$n" | grep -Eq '^[A-Za-z0-9_]+\.mp4$' || { echo "ungültig: $n"; continue; }
            gh release delete-asset clips "$n" -R "$GITHUB_REPOSITORY" -y || true
          done
      - name: Clip-Liste und Vorschauen aktualisieren
        run: |
          python scripts/update_index.py
          git config user.name "clipforge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/clips.json "$RUNNER_TEMP/mine.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python scripts/update_index.py --merge "$RUNNER_TEMP/mine.json"
            git add docs/clips.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Clip-Übersicht aktualisiert [skip ci]"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i*7))
          done
          exit 1
