name: CLIPFORGE public VOD import diagnostic
on:
  push:
    branches: [test/public-vod-import]
    paths: [.github/workflows/vod-import-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m pip install --disable-pip-version-check -q yt-dlp
      - name: Download public test excerpt
        run: |
          python -m yt_dlp --no-playlist -f 'best[height<=720]/best' --download-sections '*00:42:00-00:43:10' --force-keyframes-at-cuts -o sample.mp4 'https://www.twitch.tv/videos/2932305259'
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 sample.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: vod-chat-peak-42m
          path: sample.mp4
          retention-days: 1
