name: CLIPFORGE – Standbilder (Facecam-Position)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPROVED_CHANNELS: ${{ vars.APPROVED_CHANNELS || 'kaicenat,xqc,jynxzi,caseoh_,ohnepixel,hasanabi,montanablack88,trymacs,papaplatte,eliasn97,knossi,revedtv' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && python -m pip install -q "streamlink>=8,<9"
      - run: gh release view debug >/dev/null 2>&1 || gh release create debug --title debug --notes "Standbilder" --latest=false
      - run: python -u scripts/snapshots.py
