<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClipForge Clips</title>
<meta name="description" content="Alle Clips aus den ClipForge-Läufen: ansehen, herunterladen, Beschreibung kopieren.">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ClipForge">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #14161a; --muted: #5d6470; --line: #e3e6eb;
    --accent: #ff4d4f; --accent-text: #ffffff; --chip: #eef0f3; --ok: #1f9d55; --warn: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b21; --text: #eef0f3; --muted: #9aa3af; --line: #2a2f37;
      --accent: #ff5c5f; --accent-text: #ffffff; --chip: #232730; --ok: #45c07a; --warn: #e0a84a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --card: #181b21; --text: #eef0f3; --muted: #9aa3af; --line: #2a2f37;
    --accent: #ff5c5f; --accent-text: #ffffff; --chip: #232730; --ok: #45c07a; --warn: #e0a84a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
           padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .bar::-webkit-scrollbar { display: none; }
  .chip { border: 0; background: var(--chip); color: var(--text); padding: 7px 12px; border-radius: 999px;
          font-size: 14px; white-space: nowrap; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  main { padding: 12px 16px 40px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  video { width: 100%; aspect-ratio: 9 / 16; max-height: 62vh; object-fit: contain; background: #000; display: block; }
  .body { padding: 10px 12px 12px; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name { font-weight: 650; font-size: 16px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .badge.camp { color: var(--accent-text); background: var(--accent); }
  .meta { color: var(--muted); font-size: 12.5px; }
  .caption { font-size: 13px; background: var(--chip); border-radius: 8px; padding: 8px; white-space: pre-wrap; max-height: 7.5em; overflow: auto; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 10px;
         border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none; font-size: 14px; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }
  .rules { grid-column: 1 / -1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; }
  .rules b { color: var(--text); }
  .rules ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>ClipForge Clips</h1>
  <div class="sub" id="status">Lade Clips …</div>
  <div class="bar" id="filters" role="toolbar" aria-label="Filter"></div>
  <div class="bar" role="toolbar" aria-label="Sortierung">
    <button class="chip" data-sort="best" aria-pressed="true">Beste zuerst</button>
    <button class="chip" data-sort="new" aria-pressed="false">Neueste zuerst</button>
  </div>
</header>
<main id="list"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const RULES = {
  clipup: { title: "ClipUp GTA VI", items: ["Offizielles Logo die ganze Zeit sichtbar, nie verdeckt", "#gta6 #Clipup in der Beschreibung",
            "Nur Aufrufe aus USA, UK, CAN, AUS zählen; ab 3.000 Aufrufen", "Post 60 Tage online lassen, sofort einreichen",
            "Instagram: Statistik-Formular nach Mindest-Aufrufen"] },
  dylanpage: { title: "Dylan Page", items: ["Nur TikTok, Reels, X, Shorts; 9:16", "Dylan muss die ganze Zeit im Fokus sein",
            "#DylanPage in die Beschreibung, alles auf Englisch", "Keine fremden Logos oder Wasserzeichen",
            "Jeder Clip mit eigenem Vorschaubild; keine irreführenden Titel"] },
  lacy: { title: "Lacy GTA VI Marathon", items: ["Clips nur aus Lacys Streams", "Jeder Clip braucht 500 Aufrufe, insgesamt 750K",
            "Sofort nach dem Posten einreichen"] }
};
const LABEL = { "": "Ohne Kampagne", clipup: "ClipUp", dylanpage: "Dylan Page", lacy: "Lacy" };
let clips = [], filter = "all", sort = "best";
const $ = s => document.querySelector(s);
function campOf(c) { return c.campaign || (c.streamer === "lacy" ? "lacy" : ""); }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1600); }
function fmtDate(s) { try { return new Date(s).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }); } catch { return ""; } }
function mb(b) { return b ? (b / 1048576).toFixed(1) + " MB" : ""; }
function buildFilters() {
  const camps = [...new Set(clips.map(campOf))];
  const box = $("#filters"); box.innerHTML = "";
  [["all", "Alle (" + clips.length + ")"], ...camps.map(k => [k, (LABEL[k] || k) + " (" + clips.filter(c => campOf(c) === k).length + ")"])]
    .forEach(([k, t]) => { const b = document.createElement("button"); b.className = "chip"; b.textContent = t;
      b.setAttribute("aria-pressed", String(k === filter)); b.onclick = () => { filter = k; buildFilters(); render(); }; box.appendChild(b); });
}
function render() {
  const list = $("#list"); list.innerHTML = "";
  if (filter !== "all" && RULES[filter]) {
    const r = RULES[filter], d = document.createElement("div"); d.className = "rules";
    d.innerHTML = "<b>Regeln " + r.title + "</b><ul>" + r.items.map(i => "<li>" + i + "</li>").join("") + "</ul>"; list.appendChild(d);
  }
  let rows = clips.filter(c => filter === "all" || campOf(c) === filter);
  rows.sort(sort === "best" ? (a, b) => (b.score || 0) - (a.score || 0) || (b.added || "").localeCompare(a.added || "")
                            : (a, b) => (b.added || "").localeCompare(a.added || ""));
  if (!rows.length) { list.insertAdjacentHTML("beforeend", '<div class="empty">Noch keine Clips in dieser Auswahl.</div>'); return; }
  for (const c of rows) {
    const card = document.createElement("article"); card.className = "card";
    const camp = campOf(c);
    card.innerHTML = `
      <video controls playsinline preload="metadata" src="${c.url}#t=0.5"></video>
      <div class="body">
        <div class="row"><span class="name"></span>${camp ? `<span class="badge camp">${LABEL[camp] || camp}</span>` : ""}</div>
        <div class="meta">${fmtDate(c.added)} · ${mb(c.bytes)}${c.score ? " · Punkte " + Number(c.score).toFixed(1) : ""}</div>
        <div class="caption"></div>
        <div class="actions">
          <a class="btn primary" href="${c.url}" download="${c.file}" target="_blank" rel="noopener">Herunterladen</a>
          <button class="btn" type="button">Text kopieren</button>
        </div>
      </div>`;
    card.querySelector(".name").textContent = c.streamer || c.file;
    card.querySelector(".caption").textContent = c.caption || "";
    card.querySelector("button.btn").onclick = async () => {
      try { await navigator.clipboard.writeText(c.caption || ""); toast("Beschreibung kopiert"); }
      catch { toast("Kopieren nicht möglich – Text gedrückt halten"); }
    };
    list.appendChild(card);
  }
}
document.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
  sort = b.dataset.sort; document.querySelectorAll("[data-sort]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render();
});
fetch("clips.json?ts=" + Date.now()).then(r => r.json()).then(d => {
  clips = (d.clips || []).filter(c => c.url);
  $("#status").textContent = clips.length + " Clips · aktualisiert " + fmtDate(d.updated);
  buildFilters(); render();
}).catch(() => { $("#status").textContent = "Clip-Liste konnte nicht geladen werden."; });
</script>
</body>
</html>
